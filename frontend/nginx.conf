# 1. Redirection HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 113-30-188-238.eu-cloud-xip.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Serveur HTTPS principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 113-30-188-238.eu-cloud-xip.com;

    # Certificats SSL montés depuis le VPS
    ssl_certificate /etc/letsencrypt/live/113-30-188-238.eu-cloud-xip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/113-30-188-238.eu-cloud-xip.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Single Page Application React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API vers le backend Flask
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
